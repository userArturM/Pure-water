<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Бутыль воды с помпой</title><desc id="desc">Анимация подачи воды из бутыли с помпой в стакан</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f7ff"/><stop offset="1" stop-color="#cceaff"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#42b9ff"/><stop offset=".5" stop-color="#8de1ff"/><stop offset="1" stop-color="#1696e8"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".82"/><stop offset="1" stop-color="#9bdcff" stop-opacity=".42"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#196ca8" flood-opacity=".18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <clipPath id="bottleClip"><path d="M235 175 Q235 145 265 132 L265 92 Q265 75 282 75 H330 Q347 75 347 92 V132 Q377 145 377 175 L405 400 Q409 440 372 454 H210 Q173 440 177 400 Z"/></clipPath>
</defs>
<rect x="10" y="10" width="700" height="500" rx="42" fill="url(#bg)"/>
<circle cx="360" cy="245" r="185" fill="#fff" opacity=".52"/>
<ellipse cx="350" cy="459" rx="245" ry="28" fill="#5bb7e9" opacity=".18" filter="url(#soft)"/>
<!-- bottle -->
<g filter="url(#shadow)">
 <path d="M235 175 Q235 145 265 132 L265 92 Q265 75 282 75 H330 Q347 75 347 92 V132 Q377 145 377 175 L405 400 Q409 440 372 454 H210 Q173 440 177 400 Z" fill="#bfeaff" fill-opacity=".68" stroke="#168fd8" stroke-width="6"/>
 <g clip-path="url(#bottleClip)">
  <rect x="165" y="330" width="260" height="135" fill="url(#water)" opacity=".9">
   <animate attributeName="y" values="330;320;330" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <path d="M165 345 Q220 330 275 345 T425 345" fill="none" stroke="#dff8ff" stroke-width="5" opacity=".85">
   <animate attributeName="d" dur="2.6s" repeatCount="indefinite" values="M165 345 Q220 330 275 345 T425 345;M165 345 Q220 355 275 345 T425 345;M165 345 Q220 330 275 345 T425 345"/>
  </path>
 </g>
 <path d="M265 132 H347 V173 H265Z" fill="#8edcff" opacity=".72"/>
 <rect x="258" y="48" width="96" height="30" rx="13" fill="#117ed0"/>
 <rect x="278" y="35" width="56" height="18" rx="9" fill="#0b68b5"/>
 <path d="M306 35 V14 Q306 7 313 7 H400 Q409 7 409 16 V27 Q409 35 400 35 H306Z" fill="#147dcc"/>
 <path d="M401 35 H445 Q456 35 456 45 V52 Q456 61 445 61 H401" fill="#0f70bd"/>
 <circle cx="313" cy="35" r="8" fill="#64caff"/>
 <path d="M214 195 Q205 270 214 375" fill="none" stroke="#fff" stroke-width="10" opacity=".55" stroke-linecap="round"/>
 <path d="M238 185 Q231 250 239 390" fill="none" stroke="#fff" stroke-width="4" opacity=".45" stroke-linecap="round"/>
 <path d="M275 155 H337" stroke="#fff" stroke-width="3" opacity=".55"/>
 <path d="M207 400 Q290 430 384 400" fill="none" stroke="#fff" stroke-width="4" opacity=".45"/>
</g>
<!-- flowing water -->
<path d="M447 58 C447 100 447 115 447 145 C447 174 451 188 448 213 C445 235 454 252 459 270" fill="none" stroke="url(#water)" stroke-width="18" stroke-linecap="round" opacity=".92">
 <animate attributeName="stroke-dasharray" values="8 20;18 10;8 20" dur="1.1s" repeatCount="indefinite"/>
</path>
<path d="M459 270 C464 286 460 301 467 313" fill="none" stroke="#8ce4ff" stroke-width="8" stroke-linecap="round">
 <animate attributeName="stroke-dashoffset" values="0;-56" dur=".8s" repeatCount="indefinite"/>
</path>
<!-- glass -->
<g transform="translate(405 300)">
 <path d="M0 0 H135 L121 151 Q118 166 104 166 H31 Q17 166 14 151 Z" fill="url(#glass)" stroke="#1b9bdc" stroke-width="5"/>
 <path d="M11 110 Q68 95 124 110 V145 Q120 160 104 162 H31 Q16 159 14 145Z" fill="url(#water)" opacity=".85">
  <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M11 110 Q68 95 124 110 V145 Q120 160 104 162 H31 Q16 159 14 145Z;M11 104 Q68 115 124 104 V145 Q120 160 104 162 H31 Q16 159 14 145Z;M11 110 Q68 95 124 110 V145 Q120 160 104 162 H31 Q16 159 14 145Z"/>
 </path>
 <path d="M21 18 H115" stroke="#fff" stroke-width="5" opacity=".7" stroke-linecap="round"/>
</g>
<!-- droplets -->
<g fill="#45b9f2">
 <circle cx="476" cy="250" r="5"><animate attributeName="cy" values="250;315;250" dur="1.4s" repeatCount="indefinite"/></circle>
 <circle cx="490" cy="275" r="3"><animate attributeName="cy" values="275;320;275" dur="1.1s" repeatCount="indefinite"/></circle>
 <circle cx="455" cy="235" r="3"><animate attributeName="cy" values="235;300;235" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<!-- little label -->
<g transform="translate(54 58)"><rect width="118" height="42" rx="21" fill="#fff" opacity=".9"/><circle cx="25" cy="21" r="9" fill="#1aa0e7"/><path d="M21 21h8M25 17v8" stroke="#fff" stroke-width="2" stroke-linecap="round"/><text x="44" y="26" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#195072">19 литров</text></g>
</svg>
